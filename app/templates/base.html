<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>{% block title %}SNS Hub — Tous vos outils. Un seul accès.{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/hub.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ url_for('public.index') }}">
        <img class="brand-logo" src="{{ url_for('static', filename='img/logo-pink.png') }}"
             alt="SNS Security" width="82" height="40">
        <span class="brand-name">Hub</span>
      </a>
      <nav class="header-nav" aria-label="Navigation">
        {% block header_nav %}
        <a class="nav-link" href="{{ url_for('admin.dashboard') }}">Administration</a>
        {% endblock %}
      </nav>
    </div>
  </header>

  <main id="contenu" class="{% block main_class %}wrap{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p class="footer-brand">SNS Security <span class="footer-sep">·</span>
        <span class="footer-muted">Portail interne</span></p>
      <p class="footer-meta">SNS Hub v{{ hub_version }}{% if hub_git_sha %}
        <span class="footer-sep">·</span> {{ hub_git_sha[:10] }}{% endif %}</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/hub.js') }}" defer></script>
</body>
</html>

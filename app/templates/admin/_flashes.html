{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <ul class="flash-list">
    {% for category, message in messages %}
    <li class="flash flash-{{ 'error' if category == 'error' else 'success' }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}
{% endwith %}

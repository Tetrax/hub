{% extends "base.html" %}
{% block title %}{{ code }} — SNS Hub{% endblock %}
{% block body_class %}error-page{% endblock %}
{% block header_nav %}{% endblock %}

{% block content %}
<section class="error-shell">
  <p class="error-code">{{ code }}</p>
  <h1 class="error-title">{{ title }}</h1>
  <p class="error-message">{{ message }}</p>
  <a class="button button-primary" href="{{ url_for('public.index') }}">Retour au portail</a>
</section>
{% endblock %}

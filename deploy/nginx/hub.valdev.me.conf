# SNS Hub — configuration Nginx de référence (versionnée).
#
# Copie installée : /etc/nginx/sites-available/hub.valdev.me
#              ->  /etc/nginx/sites-enabled/hub.valdev.me
#
# Contrôle d'accès : l'allowlist IP globale du VPS reste la seule source de la
# liste (include du même fichier — aucune duplication, aucune dérive) ; seul le
# loopback local est ajouté, pour que les vérifications d'exploitation sur le
# VPS puissent emprunter le chemin HTTPS réel. La validation ACME reste ouverte
# publiquement sur le port 80 (location dédiée), comme pour les autres domaines.

server {
    listen 80;
    listen [::]:80;
    server_name hub.valdev.me;

    location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
        allow all;
        root /var/www/hub-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_name hub.valdev.me;
    client_max_body_size 10m;

    # Loopback d'abord (évalué dans l'ordre), puis l'allowlist globale du VPS.
    allow 127.0.0.1;
    allow ::1;
    include /etc/nginx/conf.d/00-application-access.conf;

    location / {
        proxy_pass http://127.0.0.1:13744;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;

    # Paire gérée par le helper certificat Hub (activation atomique + rollback).
    ssl_certificate /var/lib/hub/certificates/active/fullchain.pem;
    ssl_certificate_key /var/lib/hub/certificates/active/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

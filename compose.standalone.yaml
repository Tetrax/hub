# SNS Hub — déploiement STANDALONE : HTTPS servi directement par le conteneur.
#
# Fichier **autonome**, prévu pour Portainer (Stacks → Add stack → Repository,
# compose path `compose.standalone.yaml`). Une seule variable est nécessaire :
#
#     HUB_HOSTNAME=hub.sns-security.lan      (nom DNS porté par le certificat)
#
# Optionnel : HUB_HTTPS_PORT (défaut 443).
#
# Le conteneur termine lui-même TLS (aucun Nginx, aucun Caddy, aucun proxy, aucun
# helper hôte, aucun socket Docker). Au premier démarrage il génère un certificat
# temporaire auto-signé pour HUB_HOSTNAME — le Hub est immédiatement joignable en
# HTTPS — puis le certificat définitif (PKCS#12 de la PKI) s'installe depuis la
# page Administration → Certificats, sans SSH et sans redémarrage.

name: hub-standalone

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HUB_GIT_SHA: "${HUB_GIT_SHA:-unknown}"
    image: "hub:${HUB_IMAGE_TAG:-standalone}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Seul HTTPS est publié : le serveur applicatif termine TLS (voir D16).
      # Ports internes non privilégiés → aucun CAP_NET_BIND_SERVICE nécessaire.
      - "${HUB_HTTPS_PORT:-443}:8443"
    networks:
      default:
        # IPv4 statique OPTIONNELLE : vide → Compose omet la clé et Docker
        # attribue une adresse normalement (aucune valeur par défaut imposée).
        ipv4_address: ${HUB_IPV4_ADDRESS:-}
    environment:
      HUB_DATA_DIR: /data
      # Nom porté par le certificat : validé à l'import du PKCS#12/PEM.
      HUB_TLS_HOSTNAME: "${HUB_HOSTNAME:?HUB_HOSTNAME est requis (nom DNS du Hub)}"
      # TLS direct : gunicorn sert HTTPS sur le port interne, l'activation d'un
      # certificat recharge le serveur (SIGHUP) et vérifie le certificat servi.
      HUB_TLS_CERT: /certs/active/fullchain.pem
      HUB_TLS_KEY: /certs/active/privkey.pem
      HUB_TLS_BIND_PORT: "8443"
      HUB_CERTS_DIR: /certs
      HUB_CERT_BACKEND: local
      HUB_GUNICORN_PIDFILE: /tmp/gunicorn.pid
      HUB_SESSION_TTL_SECONDS: "${HUB_SESSION_TTL_SECONDS:-43200}"
      HUB_GIT_SHA: "${HUB_GIT_SHA:-unknown}"
    volumes:
      # Volumes nommés : initialisés depuis l'image avec les droits de l'utilisateur
      # applicatif (uid 1000) — aucune commande d'initialisation sur l'hôte.
      - hub_data:/data
      # Générations de certificats + lien `active` + état de rollback.
      - hub_certs:/certs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl,sys,urllib.request;ctx=ssl._create_unverified_context();sys.exit(0 if urllib.request.urlopen('https://127.0.0.1:8443/healthz', timeout=5, context=ctx).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  hub_data:
  hub_certs:

networks:
  # Réseau du stack. Par défaut : le réseau Docker du projet
  # (<nom du stack>_default), donc aucune valeur propre à un environnement et
  # aucun prérequis — c'est le comportement historique, inchangé.
  #
  # Pour rattacher Hub à un réseau Docker EXISTANT :
  #   HUB_DOCKER_NETWORK=<nom du réseau>            (obligatoire pour ce cas)
  #   HUB_DOCKER_NETWORK_EXTERNAL=true              (optionnel : exige que le
  #                                                  réseau existe déjà, sinon
  #                                                  Compose peut en créer un
  #                                                  homonyme)
  #   HUB_IPV4_ADDRESS=<adresse>                    (optionnel : IPv4 statique —
  #                                                  le réseau cible doit avoir un
  #                                                  sous-réseau qui la contient)
  default:
    name: ${HUB_DOCKER_NETWORK:-${COMPOSE_PROJECT_NAME:-hub-standalone}_default}
    external: ${HUB_DOCKER_NETWORK_EXTERNAL:-false}

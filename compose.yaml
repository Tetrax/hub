# SNS Hub — Compose générique (portable, versionné, source de vérité du déploiement).
#
# Ce fichier est volontairement NEUTRE : il ne contient aucune valeur propre à
# une installation (hostname, port, sous-réseau, UID/GID, proxy de confiance).
# Tout se règle par variables, dans un fichier `.env` (voir `.env.example`) :
#
#     cp .env.example .env && éditez .env
#     docker compose up -d --build
#
# Sur le VPS de production, la surcharge `compose.vps.yaml` ajoute les valeurs
# locales (sous-réseau fixé, proxy de confiance, hostname) :
#
#     COMPOSE_FILE=compose.yaml:compose.vps.yaml   (dans le .env du VPS)
#
# Build : contexte = racine du dépôt (`scripts/build.sh`). L'image est taguée
# avec le SHA Git ; HUB_IMAGE_TAG permet de déployer une image précise.
# Données persistantes : HUB_DATA_PATH (défaut ./runtime/data, hors Git).
# Certificat : géré hors conteneur par le helper root (optionnel) — voir docs.

name: hub

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HUB_GIT_SHA: "${HUB_GIT_SHA:-unknown}"
    image: "hub:${HUB_IMAGE_TAG:-local}"
    container_name: "${HUB_CONTAINER_NAME:-hub-web}"
    restart: unless-stopped
    # L'utilisateur applicatif doit posséder le répertoire de données (HUB_DATA_PATH) :
    #   sudo install -d -o "${HUB_UID:-1000}" -g "${HUB_GID:-1000}" runtime/data
    user: "${HUB_UID:-1000}:${HUB_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Défaut sûr : loopback uniquement, pour un reverse proxy sur la même machine.
      # Sans proxy local (VM en accès direct), mettre HUB_BIND_IP=0.0.0.0 (ou l'IP LAN)
      # et n'ouvrir le port qu'au réseau autorisé (pare-feu / ACL) — voir docs.
      - "${HUB_BIND_IP:-127.0.0.1}:${HUB_PORT:-13744}:8000"
    environment:
      HUB_DATA_DIR: /data
      # Libellé affiché à côté du logo SNS (purement visuel : aucun effet sur le
      # hostname, le certificat, la base ou les sessions). Vide = « HUB ».
      HUB_BRAND_LABEL: "${HUB_BRAND_LABEL:-}"
      # Secrets d'infrastructure de la surveillance Trivy (V1.6) : fournis par le
      # déploiement, jamais versionnés, jamais en base. Jeton GitHub en LECTURE
      # SEULE (portée Actions) pour télécharger l'artefact `trivy-report`.
      HUB_GITHUB_TOKEN: "${HUB_GITHUB_TOKEN:-}"
      # Secrets email (V1.6.1) : **bootstrap uniquement**. Le transport email et
      # ses secrets se configurent dans l'administration (Sécurité → Alertes) ;
      # ces variables ne servent que tant qu'aucun secret administré n'existe.
      # Un secret enregistré dans la webapp est toujours prioritaire (voir D23).
      HUB_SMTP_PASSWORD: "${HUB_SMTP_PASSWORD:-}"
      HUB_MICROSOFT_CLIENT_SECRET: "${HUB_MICROSOFT_CLIENT_SECRET:-}"
      # Hostname attendu dans le certificat TLS (affichage + validation helper) : à
      # définir côté installation ; vide = aucune attente particulière.
      HUB_TLS_HOSTNAME: "${HUB_TLS_HOSTNAME:-}"
      # Socket du helper certificat (optionnel) : sans helper, l'import de
      # certificat est simplement indisponible, le reste du Hub fonctionne.
      HUB_CERT_HELPER_SOCKET: "${HUB_CERT_HELPER_SOCKET:-/run/hub-cert-helper/helper.sock}"
      # Frontière de confiance proxy : IP/CIDR du reverse proxy qui a le droit
      # de fournir X-Forwarded-Proto / X-Forwarded-For. Vide = aucun proxy de
      # confiance (les en-têtes sont ignorés). Ex. derrière un LB : 10.20.0.5/32.
      HUB_TRUSTED_PROXY_CIDRS: "${HUB_TRUSTED_PROXY_CIDRS:-}"
      HUB_SESSION_TTL_SECONDS: "${HUB_SESSION_TTL_SECONDS:-43200}"
      HUB_GIT_SHA: "${HUB_GIT_SHA:-unknown}"
    volumes:
      - type: bind
        source: "${HUB_DATA_PATH:-./runtime/data}"
        target: /data
      # Répertoire du socket du helper (absent = répertoire vide créé par Docker,
      # sans conséquence : la page Certificats signale le helper indisponible).
      - type: bind
        source: "${HUB_CERT_HELPER_DIR:-/run/hub-cert-helper}"
        target: /run/hub-cert-helper
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Aucun réseau explicite : Docker attribue automatiquement un sous-réseau
# (aucun risque de conflit avec le SI). Un sous-réseau fixé n'est nécessaire
# que pour rendre l'adresse du proxy de confiance déterministe — voir
# `compose.vps.yaml`, qui porte ce cas.
